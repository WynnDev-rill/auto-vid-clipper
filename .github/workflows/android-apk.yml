name: Build ClipForge APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "clip icon.png"
      - "native-android/**"
      - "capacitor.config.json"
      - "native-shell/**"
      - "src/styles.css"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "clip icon.png"
      - "native-android/**"
      - "capacitor.config.json"
      - "native-shell/**"
      - "src/styles.css"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor build tools
        run: |
          npm install --legacy-peer-deps --no-save --package-lock=false \
            @capacitor/core@8.4.2 \
            @capacitor/android@8.4.2 \
            @capacitor/cli@8.4.2 \
            @capacitor/app@8.0.0 \
            @capacitor/assets@3.0.5
          # Capacitor discovers native plugins from package.json. Keep this CI-only
          # dependency registration so the App plugin is actually bundled.
          npm pkg set "dependencies.@capacitor/app=8.0.0"

      - name: Create Android project
        run: |
          rm -rf android assets
          mkdir -p assets
          cp native-android/clipforge-icon.svg assets/icon.svg
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugins_path = Path("android/app/src/main/assets/capacitor.plugins.json")
          plugins = json.loads(plugins_path.read_text())
          assert any(plugin.get("pkg") == "@capacitor/app" for plugin in plugins), plugins
          print("Verified native @capacitor/app plugin:", plugins)
          PY

      - name: Generate native adaptive icon and splash assets
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#11183b' \
            --iconBackgroundColorDark '#11183b' \
            --splashBackgroundColor '#0b1026' \
            --splashBackgroundColorDark '#0b1026'
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set Android version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text()
          text = re.sub(r'versionCode\s+\d+', 'versionCode 2', text)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.1"', text)
          build_file.write_text(text)
          PY

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare clean APK filename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ClipForge-v1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-v1.0.1
          path: ClipForge-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30
