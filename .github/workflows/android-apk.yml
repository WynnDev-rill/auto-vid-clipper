name: Build ClipForge APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - "capacitor.config.json"
      - "native-shell/**"
      - "scripts/configure-clipforge-android.mjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPFORGE_VERSION_NAME: "2.0.${{ github.run_number }}"
  CLIPFORGE_KEY_ALIAS: "clipforge"
  CLIPFORGE_KEYSTORE_PASSWORD: "enZBtxGNZSgtMJixzf49GIUuMZ1rHltX"
  GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

jobs:
  build-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor build tools
        run: |
          npm install --legacy-peer-deps --no-save --package-lock=false --prefer-offline --no-audit --no-fund \
            @capacitor/core@8.4.2 \
            @capacitor/android@8.4.2 \
            @capacitor/cli@8.4.2 \
            @capacitor/app@8.0.0 \
            @capacitor/assets@3.0.5
          npm pkg set "dependencies.@capacitor/app=8.0.0"

      - name: Create Android project
        run: |
          rm -rf android assets
          mkdir -p assets
          cp native-android/clipforge-icon.svg assets/icon.svg
          npx cap add android
          npx cap sync android
          node scripts/configure-clipforge-android.mjs
          test -f android/app/src/main/java/com/wynndev/clipforge/MainActivity.java
          grep -q 'package com.wynndev.clipforge' android/app/src/main/java/com/wynndev/clipforge/MainActivity.java
          grep -q 'ClipForgeNative' android/app/src/main/java/com/wynndev/clipforge/MainActivity.java
          grep -q 'downloadFile' android/app/src/main/java/com/wynndev/clipforge/MainActivity.java
          grep -q 'getAppVersion' android/app/src/main/java/com/wynndev/clipforge/MainActivity.java
          grep -Fq 'setDecorFitsSystemWindows(getWindow(), false)' android/app/src/main/java/com/wynndev/clipforge/MainActivity.java

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-clipforge-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-clipforge-gradle-

      - name: Generate native adaptive icon and splash assets
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#11183b' \
            --iconBackgroundColorDark '#11183b' \
            --splashBackgroundColor '#0b1026' \
            --splashBackgroundColorDark '#0b1026'
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set Android version metadata
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text()
          version_code = 20000 + int(os.environ["VERSION_CODE"])
          text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["CLIPFORGE_VERSION_NAME"]}"', text)
          build_file.write_text(text)
          print("ClipForge versionCode:", version_code)
          PY

      - name: Restore stable release signing key
        run: |
          base64 -d native-android/clipforge-release-keystore.b64 > "$RUNNER_TEMP/clipforge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/clipforge-release.jks" \
            -storepass "$CLIPFORGE_KEYSTORE_PASSWORD" -alias "$CLIPFORGE_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          STORE_FILE: ${{ runner.temp }}/clipforge-release.jks
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          android.injected.signing.store.file=$STORE_FILE
          android.injected.signing.store.password=$CLIPFORGE_KEYSTORE_PASSWORD
          android.injected.signing.key.alias=$CLIPFORGE_KEY_ALIAS
          android.injected.signing.key.password=$CLIPFORGE_KEYSTORE_PASSWORD
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - name: Verify APK signature and package
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='com.wynndev.clipforge'"

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ClipForge-v${CLIPFORGE_VERSION_NAME}.apk"
          sha256sum "ClipForge-v${CLIPFORGE_VERSION_NAME}.apk" > "ClipForge-v${CLIPFORGE_VERSION_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-v${{ env.CLIPFORGE_VERSION_NAME }}
          path: |
            ClipForge-v${{ env.CLIPFORGE_VERSION_NAME }}.apk
            ClipForge-v${{ env.CLIPFORGE_VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish app update release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CLIPFORGE_VERSION_NAME }}
          name: ClipForge v${{ env.CLIPFORGE_VERSION_NAME }}
          body: |
            ClipForge Android update.
            Install over the existing app; the package ID and signing identity are unchanged.
          make_latest: true
          files: |
            ClipForge-v${{ env.CLIPFORGE_VERSION_NAME }}.apk
            ClipForge-v${{ env.CLIPFORGE_VERSION_NAME }}.sha256
