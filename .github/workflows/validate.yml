name: Validate ClipForge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Validate serverless resolver syntax
        run: python3 -m py_compile api/resolve.py api/community-ai.py

  android-native:
    name: Android native compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install minimal Capacitor build tools
        run: |
          npm install --legacy-peer-deps --no-save --package-lock=false --prefer-offline --no-audit --no-fund \
            @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/cli@8.4.2 @capacitor/app@8.0.0
          npm pkg set "dependencies.@capacitor/app=8.0.0"
      - name: Generate and compile native bridge
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/configure-clipforge-android.mjs
          node scripts/fix-clipforge-generated-java.mjs
          chmod +x android/gradlew
          cd android
          ./gradlew compileReleaseJavaWithJavac --no-daemon --parallel
