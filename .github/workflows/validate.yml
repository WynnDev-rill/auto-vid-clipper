name: Validate ClipForge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Validate serverless resolver syntax
        run: python3 -m py_compile api/resolve.py api/community-ai.py
