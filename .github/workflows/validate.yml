name: Validate ClipForge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build

  worker:
    name: Worker TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
