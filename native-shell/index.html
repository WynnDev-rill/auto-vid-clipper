<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <title>ClipForge</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #0b1026;
        color: #f7f7fb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #aeb4c8;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ClipForge</h1>
      <p>Connect to the internet and reopen the app to load ClipForge.</p>
    </main>
  </body>
</html>
